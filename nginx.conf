server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Vite emits content-hashed filenames under /assets/ — cache them forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The entrypoint must never be cached: StartOS clients (Android 6 WebView
    # included) cannot clear their caches, so a new deploy would never appear.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # The sync/API service (127.0.0.1:8080) serves /api/frame (aggregated
    # events, weather and the album manifest) and /api/radar (+ proxied radar
    # tiles). The frame streams photos straight from Apple's CDN; radar tiles
    # come through this box because Android 6 lacks the ISRG Root X1 that
    # RainViewer's chain ends at.
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        # JSON and tiles set their own cache policy in the API service.
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
