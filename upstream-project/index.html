<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1280, initial-scale=1, user-scalable=no">
  <meta name="theme-color" content="#F2EEE6">
  <title>Home HQ</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Instrument+Serif:ital@0;1&display=swap">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/lock.css">
  <link rel="stylesheet" href="css/views/home.css">
  <link rel="stylesheet" href="css/views/weather.css">
  <link rel="stylesheet" href="css/views/calendar.css">
  <link rel="stylesheet" href="css/views/meals.css">
  <link rel="stylesheet" href="css/views/school.css">
  <link rel="stylesheet" href="css/views/tasks.css">
  <link rel="stylesheet" href="css/views/shopping.css">
  <link rel="stylesheet" href="css/views/photos.css">
  <link rel="stylesheet" href="css/views/vestaboard.css">
  <link rel="stylesheet" href="css/views/control.css">
  <link rel="stylesheet" href="css/views/user.css">
  <link rel="stylesheet" href="css/views/ambient.css">
</head>
<body>
  <div class="stage" id="stage" data-mode="day">
    <nav class="rail" id="rail" aria-label="Sections">
      <button class="rail-item" data-go="home"><svg class="i" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg><span>Today</span></button>
      <button class="rail-item" data-go="weather"><svg class="i" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18.5h10.2a4.3 4.3 0 0 0 .4-8.6A6.2 6.2 0 0 0 5.8 11.6 3.5 3.5 0 0 0 7 18.5z"/><path d="M8.5 21l-1 2M12.5 21l-1 2M16.5 21l-1 2"/></svg><span>Weather</span></button>
      <button class="rail-item" data-go="calendar"><svg class="i" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Calendar</span></button>
      <button class="rail-item" data-go="photos"><svg class="i" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 8"/></svg><span>Photos</span></button>
      <button class="rail-item" data-go="meals"><svg class="i" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v8M4.5 3v5a2.5 2.5 0 0 0 5 0V3M7 11v10M17 21V3c-2.5 1.5-3.5 4-3.5 8h3.5"/></svg><span>Meals</span></button>
      <button class="rail-item" data-go="school"><svg class="i" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8.5l10-4 10 4-10 4z"/><path d="M6 10.5v5c0 1.7 2.7 3 6 3s6-1.3 6-3v-5"/><path d="M22 8.5V15"/></svg><span>School</span></button>
      <button class="rail-item" data-go="tasks"><svg class="i" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M7.5 12l3 3 6-6"/></svg><span>Chores</span></button>
      <button class="rail-item" data-go="shopping"><svg class="i" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2.2l2.3 11h10.8L21 8H6.5"/><circle cx="10" cy="19.5" r="1.5"/><circle cx="17" cy="19.5" r="1.5"/></svg><span>Groceries</span></button>
      <button class="rail-item" data-go="vestaboard"><svg class="i" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M3 14h18M8 4v16M13 4v16M18 4v16"/></svg><span>Vestaboard</span></button>
      <button class="rail-item" data-go="control"><svg class="i" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg><span>Home</span></button>
      <button class="rail-clock" id="railClock" aria-label="Clock"></button>
    </nav>

    <main class="views">
      <section class="view" id="view-home" data-view="home"></section>
      <section class="view" id="view-weather" data-view="weather"></section>
      <section class="view" id="view-calendar" data-view="calendar"></section>
      <section class="view" id="view-meals" data-view="meals"></section>
      <section class="view" id="view-school" data-view="school"></section>
      <section class="view" id="view-tasks" data-view="tasks"></section>
      <section class="view" id="view-shopping" data-view="shopping"></section>
      <section class="view view--bleed" id="view-photos" data-view="photos"></section>
      <section class="view" id="view-vestaboard" data-view="vestaboard"></section>
      <section class="view" id="view-control" data-view="control"></section>
      <div class="banners" id="banners"></div>
    </main>

    <div class="toasts" id="toasts" aria-live="polite"></div>
    <button class="lock-float" id="railLock" aria-label="Screen lock — press and hold for options"><svg class="i" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></button>
    <div class="sheet-layer" id="sheetLayer"></div>
    <div class="takeover" id="takeover" role="alertdialog"></div>
    <div class="ambient" id="ambient"></div>
    <div class="dim" id="dim"><span class="dim-hint">Touch to wake</span></div>
    <div class="offline" id="offline">
      <div class="offline-inner">
        <div class="label">Connection</div>
        <h1 class="serif">Connecting to the dashboard…</h1>
        <p>Waiting for the StartOS dashboard service.</p>
      </div>
    </div>
  </div>

  <script>
    // Wall-display self-healing: if the app bundle failed to load (e.g. a stale page right after a
    // deploy, or a network blip), reload until it starts.
    setTimeout(function () { if (!window.App) location.reload(); }, 10000);
  </script>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
